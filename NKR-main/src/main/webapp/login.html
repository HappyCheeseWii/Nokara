<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOKARA-login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="assets/NKR-P.jpg" />
</head>

<body class="lr">
    <header>
        <div class="nkr">
            <h1>NOKARA</h1>
        </div>
    </header>
    <main class="ctn">
        <section class="img">
            <figure>
                <img src="assets/NKR-P.jpg" alt="NOKARA Logo">
            </figure>
        </section>
        <section class="cnt-form">

            <div class="form" id="login">
                <h2>Inicio de sesión</h2>
                <form action="LoginServlet" method="post" >
                    <!--correo-->
                    <label>Correo</label>
                    <input type="email" id="correoIdL" name="email" >

                    <!--contraseña-->
                    <label>Contraseña</label>
                    <input type="password" id="passwordIdL" name="password" >

                    <!--btn-->
                    <button type="submit">Iniciar sesión</button>

                    <p id="mlogin"></p>

                    <p>
                        ¿Aún no tienes una cuenta?
                        <a href="register.html">Registrate</a>
                    </p>
                </form>
            </div>
        </section>

    </main>
    <footer>
    </footer>

    <script src="/js/script.js" defer></script>
</body>

</html>
