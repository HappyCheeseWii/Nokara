<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOKARA-Registro</title>
    <link rel="stylesheet" href="css/styles.css">
     <link rel="icon" href="assets/NKR-P.jpg" />
</head>

<body class="lr">
    <header>
        <div class="nkr">
            <h1>NOKARA</h1>
        </div>
    </header>
    <main class="ctn">
        <section class="img">
            <figure>
                <img src="assets/NKR-P.jpg" alt="NOKARA Logo">
            </figure>
        </section>
        <section class="cnt-form">
            <div class="form" id="registro">
                <h2>Registrate</h2>
                <form action="RegisterServlet" method="post">
                    <!--correo-->
                    <label>Correo</label>
                    <input type="email" id="emailIdR" name="email">

                    <!--nombre d usuario-->
                    <label>Nombre de usuario</label>
                    <input type="text" id="usernameIdR" name="username">

                    <!--contraseña-->
                    <label>Contraseña</label>
                    <input type="password" id="passwordIdR" name="password">

                    <!--btn-->
                    <button type="submit">Registrar</button>

                    <p id="mRegistro"></p>

                    <p>
                        ¿Ya tienes una cuenta?
                        <a href="login.html">Iniciar sesión</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script src="/js/script.js" defer></script>
</body>

</html>
